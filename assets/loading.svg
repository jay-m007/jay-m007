<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" role="img" aria-label="A loading bar for my portfolio that gets stuck at 99 percent">
<style>
@keyframes fill{0%{width:0}60%{width:150px}75%{width:300px}88%{width:385px}100%{width:392px}}
@keyframes a{0%,30%{opacity:1}31%,100%{opacity:0}}
@keyframes b{0%,30%{opacity:0}31%,70%{opacity:1}71%,100%{opacity:0}}
@keyframes c{0%,70%{opacity:0}71%,100%{opacity:1}}
.bar{animation:fill 8s cubic-bezier(.3,.1,.3,1) infinite}
.t1{animation:a 8s steps(1) infinite}.t2{animation:b 8s steps(1) infinite}.t3{animation:c 8s steps(1) infinite}
.m{font-family:ui-monospace,Menlo,Consolas,monospace}
</style>
<rect width="520" height="120" rx="14" fill="#0b0c12"/>
<rect x="1" y="1" width="518" height="118" rx="13" fill="none" stroke="#262a3a"/>
<text x="62" y="38" class="m" font-size="14" fill="#e8ecff">Loading my portfolio...</text>
<rect x="62" y="54" width="396" height="18" rx="9" fill="#1a1c27" stroke="#262a3a"/>
<rect class="bar" x="62" y="54" height="18" width="0" rx="9" fill="#ff5cad"/>
<g class="m" font-size="13" text-anchor="middle">
<text class="t1" x="260" y="98" fill="#aab0c4">47%  almost there</text>
<text class="t2" x="260" y="98" fill="#febc2e">99%  almost there</text>
<text class="t3" x="260" y="98" fill="#ff7a8a">99%  still 99%. it's a feature now.</text>
</g>
</svg>
