<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" width="520" height="270" role="img" aria-label="Animated terminal: fixing one bug creates three more, then a coffee refill">
<style>@keyframes t0{0%,0.00%{width:0}14.58%,94%{width:214px}100%{width:0}}#r0{animation:t0 12s steps(25,end) infinite}@keyframes t1{0%,16.67%{width:0}28.33%,94%{width:172px}100%{width:0}}#r1{animation:t1 12s steps(20,end) infinite}@keyframes t2{0%,30.00%{width:0}46.33%,94%{width:239px}100%{width:0}}#r2{animation:t2 12s steps(28,end) infinite}@keyframes t3{0%,48.33%{width:0}60.00%,94%{width:172px}100%{width:0}}#r3{animation:t3 12s steps(20,end) infinite}@keyframes t4{0%,61.67%{width:0}79.75%,94%{width:264px}100%{width:0}}#r4{animation:t4 12s steps(31,end) infinite}@keyframes b{50%{opacity:0}}.cur{animation:b 1s steps(1) infinite}@keyframes s{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}.st{animation:s 2.4s ease-in-out infinite}</style>
