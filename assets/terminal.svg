<clipPath id="c0"><rect id="r0" x="28" y="68" width="0" height="24"/></clipPath><text x="28" y="84" clip-path="url(#c0)" fill="#e8ecff" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14">$ git commit -m "fix bug"</text><clipPath id="c1"><rect id="r1" x="28" y="102" width="0" height="24"/></clipPath><text x="28" y="118" clip-path="url(#c1)" fill="#ff7a8a" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14">&gt; 3 new bugs created</text><clipPath id="c2"><rect id="r2" x="28" y="136" width="0" height="24"/></clipPath><text x="28" y="152" clip-path="url(#c2)" fill="#e8ecff" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14">$ git commit -m "fix 3 bugs"</text><clipPath id="c3"><rect id="r3" x="28" y="170" width="0" height="24"/></clipPath><text x="28" y="186" clip-path="url(#c3)" fill="#ff7a8a" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14">&gt; 9 new bugs created</text><clipPath id="c4"><rect id="r4" x="28" y="204" width="0" height="24"/></clipPath><text x="28" y="220" clip-path="url(#c4)" fill="#5ee0a0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14">$ coffee --refill &amp;&amp; keep going</text>
